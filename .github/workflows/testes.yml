name: Testes Python

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes com Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Verificar compatibilidade das dependências
        run: python -m pip check

      - name: Executar testes e gerar relatórios
        run: python -m pytest

      - name: Disponibilizar relatórios
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-testes-python
          path: |
            reports/relatorio-testes.html
            reports/resultados.xml
          if-no-files-found: warn
          retention-days: 14
